apiVersion: apps/v1
kind: Deployment
metadata:
  name: kredius-frontend
  namespace: kredius
spec:
  replicas: 1
  revisionHistoryLimit: 2   # old ReplicaSets kept for rollback; each pins its image tag
  selector:
    matchLabels:
      app: kredius-frontend
  template:
    metadata:
      labels:
        app: kredius-frontend
    spec:
      containers:
        - name: frontend
          image: kredius-frontend:0.1.6
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: 16Mi
              cpu: 10m
            limits:
              memory: 64Mi
              cpu: 100m
---
apiVersion: v1
kind: Service
metadata:
  name: kredius-frontend
  namespace: kredius
spec:
  type: ClusterIP
  selector:
    app: kredius-frontend
  ports:
    - port: 8080
      targetPort: 8080
