spring:
  application:
    name: kredius-api
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://10.0.0.49:5432/kredius}
    username: ${SPRING_DATASOURCE_USERNAME:kredius}
    password: ${SPRING_DATASOURCE_PASSWORD:kredius}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      # Flyway owns the schema (db/migration); Hibernate only checks the entities match it.
      ddl-auto: validate
    open-in-view: false
    show-sql: false

server:
  port: 8080

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
  show-actuator: false

kredius:
  statement:
    # Guess categories from the merchant dictionary at upload and learn patterns on categorize.
    auto-categorize: ${KREDIUS_AUTO_CATEGORIZE:false}
