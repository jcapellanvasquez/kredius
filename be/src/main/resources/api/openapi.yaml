        icon:
          type: string
          nullable: true
        balance:
          type: number
          format: double
          description: Ledger balance at the end of the month, RD$
        previousBalance:
          type: number
          format: double
          nullable: true
          description: Ledger balance at the end of the previous month, RD$; null when the account has no lines before this month
        income:
          type: number
          format: double
          description: The month's income-account credits against savings, RD$
        loanPayments:
          type: array
          description: Loan installments paid or collected in the month, oldest first
          items:
            $ref: '#/components/schemas/BudgetLoanPayment'
        cardPayments:
          type: array
          description: The month's payments from savings to the credit card (posted savings lines on the card account), oldest first
          items:
            $ref: '#/components/schemas/BudgetCardPayment'
        bankBalance:
          $ref: '#/components/schemas/BudgetBankBalance'
          nullable: true
          description: The bank's balance from the latest savings statement up to the month; null without one

