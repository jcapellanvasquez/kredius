# Kredius Postgres: a single-replica StatefulSet with its data on a 2Gi PVC (local-path).
# Applied and running since 2026-09; the backend reaches it at postgres:5432.
# Credentials come from kredius-secret (postgres-user, postgres-password).
# The schema is owned by the backend's Flyway migrations (be/src/main/resources/db/migration);
# DataInitializer seeds a user and the chart of accounts only when the tables are empty.
# Back up before every deploy: kubectl exec postgres-0 -n kredius -- pg_dump -U kredius -Fc kredius > <file>.dump
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: kredius
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: kredius
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: kredius-db:0.1.0
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: kredius
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: kredius-secret
                  key: postgres-user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kredius-secret
                  key: postgres-password
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: kredius
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
