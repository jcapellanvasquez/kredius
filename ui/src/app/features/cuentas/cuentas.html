<div class="flex flex-col h-screen bg-gray-50">

  <!-- Top bar -->
  <header class="flex items-center gap-4 px-6 h-14 bg-white border-b border-gray-200 shrink-0">
    <span class="text-base font-bold text-violet-600 tracking-tight">Kredius</span>

    <nav class="ml-auto flex items-center gap-1">
      <button
        [routerLink]="['new-account']"
        class="px-3 py-1.5 text-sm text-gray-600 rounded-lg hover:bg-violet-50 hover:text-violet-600 transition-colors"
      >
        + Nueva cuenta
      </button>
      <button
        [routerLink]="['dictionary']"
        class="px-3 py-1.5 text-sm text-gray-600 rounded-lg hover:bg-violet-50 hover:text-violet-600 transition-colors"
      >
        Diccionario
      </button>
      <button
        [routerLink]="['income']"
        class="px-3 py-1.5 text-sm text-gray-600 rounded-lg hover:bg-violet-50 hover:text-violet-600 transition-colors"
      >
        Ingresos
      </button>
      <button
        [routerLink]="['upload-statement']"
        class="px-3 py-1.5 text-sm text-gray-600 rounded-lg hover:bg-violet-50 hover:text-violet-600 transition-colors"
      >
        Subir corte
      </button>
      <button
        [routerLink]="['reports']"
        class="px-3 py-1.5 text-sm text-gray-600 rounded-lg hover:bg-violet-50 hover:text-violet-600 transition-colors"
      >
        Reportes
      </button>
    </nav>
  </header>

  <!-- Body -->
  <div class="flex flex-1 overflow-hidden">

    <!-- Sidebar -->
    <aside class="w-72 bg-white border-r border-gray-200 overflow-y-auto shrink-0">
      <div class="p-3 space-y-4">

        <div>
          <p class="px-2 py-1 text-[10px] font-semibold uppercase tracking-widest text-gray-400">Activos</p>
          <div class="space-y-0.5">
            <button
              [routerLink]="['detail']"
              class="w-full flex items-center justify-between px-3 py-2.5 rounded-lg text-sm text-gray-700 hover:bg-gray-50 transition-colors group"
            >
              <span>Cuenta corriente</span>
              <svg class="w-3.5 h-3.5 text-gray-300 group-hover:text-gray-400 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m9 18 6-6-6-6"/></svg>
            </button>
            <button
              [routerLink]="['detail']"
              class="w-full flex items-center justify-between px-3 py-2.5 rounded-lg text-sm text-gray-700 hover:bg-gray-50 transition-colors group"
            >
              <span>Cuenta de ahorros</span>
              <svg class="w-3.5 h-3.5 text-gray-300 group-hover:text-gray-400 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m9 18 6-6-6-6"/></svg>
            </button>
          </div>
        </div>

        <div>
          <p class="px-2 py-1 text-[10px] font-semibold uppercase tracking-widest text-gray-400">Pasivos</p>
          <div class="space-y-0.5">
            <button
              [routerLink]="['detail']"
              class="w-full flex items-center justify-between px-3 py-2.5 rounded-lg text-sm text-gray-700 hover:bg-gray-50 transition-colors group"
            >
              <span>Tarjeta de crédito</span>
              <svg class="w-3.5 h-3.5 text-gray-300 group-hover:text-gray-400 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m9 18 6-6-6-6"/></svg>
            </button>
            <button
              [routerLink]="['financing']"
              class="w-full flex items-center justify-between px-3 py-2.5 rounded-lg text-sm text-gray-700 hover:bg-gray-50 transition-colors group"
            >
              <span>Préstamo personal</span>
              <svg class="w-3.5 h-3.5 text-gray-300 group-hover:text-gray-400 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m9 18 6-6-6-6"/></svg>
            </button>
          </div>
        </div>

        <div>
          <p class="px-2 py-1 text-[10px] font-semibold uppercase tracking-widest text-gray-400">Gastos</p>
          <div class="space-y-0.5">
            <button
              [routerLink]="['detail']"
              class="w-full flex items-center justify-between px-3 py-2.5 rounded-lg text-sm text-gray-700 hover:bg-gray-50 transition-colors group"
            >
              <span>Alimentación</span>
              <svg class="w-3.5 h-3.5 text-gray-300 group-hover:text-gray-400 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m9 18 6-6-6-6"/></svg>
            </button>
          </div>
        </div>

        <div>
          <p class="px-2 py-1 text-[10px] font-semibold uppercase tracking-widest text-gray-400">Ingresos</p>
          <div class="space-y-0.5">
            <button
              [routerLink]="['detail']"
              class="w-full flex items-center justify-between px-3 py-2.5 rounded-lg text-sm text-gray-700 hover:bg-gray-50 transition-colors group"
            >
              <span>Salario</span>
              <svg class="w-3.5 h-3.5 text-gray-300 group-hover:text-gray-400 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m9 18 6-6-6-6"/></svg>
            </button>
          </div>
        </div>

      </div>
    </aside>

    <!-- Panel -->
    <main class="flex-1 overflow-y-auto bg-gray-50 p-6">
      <router-outlet #outlet="outlet" />
      @if (!outlet.isActivated) {
        <div class="h-full flex flex-col items-center justify-center gap-2 text-center">
          <p class="text-sm font-medium text-gray-400">Selecciona una cuenta o una acción del menú</p>
          <p class="text-xs text-gray-300">El detalle aparecerá aquí</p>
        </div>
      }
    </main>

  </div>
</div>
