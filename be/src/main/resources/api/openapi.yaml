openapi: 3.0.3
info:
  title: Kredius API
  description: |
    Kredius Backend REST API — OpenAPI-first design.

    ## How it works
    This YAML file is the **single source of truth** for all API endpoints and model classes.
    The `openapi-generator-maven-plugin` reads this file during the `generate-sources` phase and
    produces:
    - `com.kredius.be.api.*` — Spring MVC interfaces annotated with `@RequestMapping`
    - `com.kredius.be.model.*` — Kotlin data classes for request/response bodies

    ## Adding a new endpoint
    1. Define the path + operation in this file
    2. Run `mvn generate-sources`
    3. Implement the updated interface in the matching `controller/` class

  version: 1.0.0
  contact:
    name: Kredius Engineering
    email: dev@kredius.com

servers:
  - url: http://localhost:8080
    description: Local development

tags:
  - name: Health
    description: Health and readiness checks
  - name: Accounts
    description: Chart of accounts management
  - name: Loans
    description: Loan management
  - name: Statements
    description: Bank statement upload, parsing, and categorization
  - name: Reports
    description: Budget reports and budget configuration
  - name: BudgetScreen
    description: Data for the monthly budget screen (Presupuesto)
  - name: ExchangeRates
    description: RD$ per US$ rates used to post US$ statement lines

paths:

  /health:
    get:
      tags: [Health]
      summary: Health check
      description: Returns the health status of the API
      operationId: healthCheck
      responses:
        '200':
          description: API is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/v1/accounts/summary:
    get:
      tags: [Accounts]
      summary: Account summary list
      description: Returns active accounts with current balance and last transaction for the current user
      operationId: getAccountsSummary
      responses:
        '200':
          description: Account summaries retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountSummaryResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/accounts:
    get:
      tags: [Accounts]
      summary: List active accounts
      description: Returns all active accounts for the current user, optionally filtered by type
      operationId: getAccounts
      parameters:
        - name: type
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/AccountType'
      responses:
        '200':
          description: Accounts retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags: [Accounts]
      summary: Create an account
      operationId: createAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountRequest'
      responses:
        '201':
          description: Account created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          description: No account codes left in the type's range
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/accounts/{id}/detail:
    get:
      tags: [Accounts]
      summary: Account detail
      description: Returns account metadata, 6-month balance trend, and the first 5 transactions
      operationId: getAccountDetail
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Account detail retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDetailResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/accounts/{id}/transactions:
    get:
      tags: [Accounts]
      summary: Account transactions (paginated)
      description: Returns a page of journal lines for the account, newest first. Call only on pagination.
      operationId: getAccountTransactions
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 5
      responses:
        '200':
          description: Transactions retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionPageResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/loans:
    get:
      tags: [Loans]
      summary: List loans
      description: Returns all active loans for the current user, optionally filtered by type
      operationId: getLoans
      parameters:
        - name: type
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/LoanType'
      responses:
        '200':
          description: Loans retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LoanResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Loans]
      summary: Create a given loan
      description: Creates a loan-given record with a WEEKLY flat-rate schedule and the disbursement journal entry
      operationId: createGivenLoan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGivenLoanRequest'
      responses:
        '201':
          description: Loan created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoanResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/loans/received:
    post:
      tags: [Loans]
      summary: Create a received loan
      description: Creates a loan-received record with a MONTHLY amortizing schedule and the disbursement journal entry
      operationId: createReceivedLoan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReceivedLoanRequest'
      responses:
        '201':
          description: Loan registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoanResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/loans/account/{accountId}:
    get:
      tags: [Loans]
      summary: Get loan detail by account
      description: Returns the loan associated with the given account, including its full installment schedule
      operationId: getLoan
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Loan detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoanDetailResponse'
        '404':
          description: Loan not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/loans/account/{accountId}/principal-payment:
    post:
      tags: [Loans]
      summary: Apply a principal-only payment to a received loan
      description: Posts the payment journal entry and regenerates the remaining installment schedule based on the chosen mode (reduce term or reduce installment)
      operationId: applyPrincipalPayment
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrincipalPaymentRequest'
      responses:
        '200':
          description: Updated loan detail with recalculated schedule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoanDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Loan not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/loans/account/{accountId}/installments/{num}/collect:
    post:
      tags: [Loans]
      summary: Pay or collect an installment
      description: |
        Marks the installment PAID and posts its scheduled amount against the savings account
        (the active account with statementType SAVINGS): interest per schedule, the rest principal.
      operationId: collectInstallment
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: num
          in: path
          required: true
          schema:
            type: integer
        - name: date
          in: query
          required: false
          description: Payment date; today when omitted
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Updated loan detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoanDetailResponse'
        '404':
          description: Loan or installment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Installment already paid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: No savings account (statementType SAVINGS)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/statement-imports:
    get:
      tags: [Statements]
      summary: List all statement imports for the current user
      operationId: listStatementImports
      responses:
        '200':
          description: List of imports ordered by statement date descending
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StatementImportSummaryResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Statements]
      summary: Upload and parse a bank statement
      description: |
        Accepts a PDF file, parses it synchronously, matches merchant dictionary,
        and posts the matched lines to the ledger. Unmatched lines wait for a category
        (the import stays PENDING_REVIEW until they are all posted or excluded).
        Rows already imported for the account (same date, description, amount,
        currency and occurrence) are skipped; the import holds only the new ones.
      operationId: uploadStatement
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, accountId, type, statementDate]
              properties:
                file:
                  type: string
                  format: binary
                accountId:
                  type: integer
                  format: int64
                type:
                  $ref: '#/components/schemas/StatementType'
                statementDate:
                  type: string
                  format: date
      responses:
        '200':
          description: Statement parsed — lines ready for review
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatementImportResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/statement-imports/{id}:
    get:
      tags: [Statements]
      summary: Get a statement import with all lines
      operationId: getStatementImport
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Statement import retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatementImportResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/statement-lines/{id}:
    patch:
      tags: [Statements]
      summary: Update a single statement line (category or exclusion)
      description: |
        Setting a category on an unposted line posts it right away (and learns the merchant
        pattern); the import becomes CONFIRMED when its last pending line is posted or excluded.
        Returns 409 when the line is already posted (use recategorize) or the import is reversed.
      operationId: patchStatementLine
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchStatementLineRequest'
      responses:
        '200':
          description: Line updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatementLineDto'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The line is already posted, or its import is reversed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/statement-lines/{id}/recategorize:
    post:
      tags: [Statements]
      summary: Move a posted line to another category
      description: |
        Adds a correction entry (dated like the original posting) that moves the amount from the
        line's current category to the new one; the original entry is never edited. The merchant
        pattern is re-learned for the new category.
      operationId: recategorizeStatementLine
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecategorizeStatementLineRequest'
      responses:
        '204':
          description: Line recategorized
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The line isn't posted yet (use PATCH), or its import is reversed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/statement-imports/{id}/confirm:
    post:
      tags: [Statements]
      summary: Confirm import — posts double-entry journal entries
      operationId: confirmStatementImport
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Import confirmed and journal entries posted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmImportResponse'
        '409':
          description: The import is reversed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Some lines still unresolved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnresolvedLinesError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/statement-imports/{id}/reverse:
    post:
      tags: [Statements]
      summary: Reverse an import — mirrors every entry it posted, recategorizations included
      operationId: reverseStatementImport
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Import reversed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatementImportResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Import isn't CONFIRMED or PENDING_REVIEW
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/budget-screen:
    get:
      tags: [BudgetScreen]
      summary: Everything the budget screen shows for one month
      description: |
        Card and savings summaries, the last upload per statement account, the uncategorized
        lines and the month's category rows (sorted by actual / budget, highest first,
        categories without a budget last). Lines of reversed imports are left out.
        A month's budget holds savings rows dated in it and the whole card statement cut in
        it: a statement cut on 26/09 counts 27/08–26/09 in September.
      operationId: getBudgetScreen
      parameters:
        - name: period
          in: query
          required: true
          description: First day of the month (YYYY-MM-01); any day of the month is accepted
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Budget screen data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetScreenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/reports/budget:
    get:
      tags: [Reports]
      summary: Budget report for a period
      description: Returns all expense accounts with budgeted and actual amounts, salary percentages, and the last payroll reference
      operationId: getBudgetReport
      parameters:
        - name: period
          in: query
          required: true
          description: First day of the report month (e.g. 2026-10-01)
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Report retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetReportResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/dictionary:
    get:
      tags: [Dictionary]
      summary: List merchant mappings
      operationId: listMerchantMappings
      responses:
        '200':
          description: Mappings retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MerchantMappingResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Dictionary]
      summary: Create a merchant mapping
      operationId: createMerchantMapping
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMerchantMappingRequest'
      responses:
        '201':
          description: Mapping created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantMappingResponse'
        '409':
          description: Pattern already exists for this user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/dictionary/{id}:
    patch:
      tags: [Dictionary]
      summary: Update the account for a mapping
      operationId: updateMerchantMapping
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMerchantMappingRequest'
      responses:
        '200':
          description: Mapping updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantMappingResponse'
        '404':
          description: Mapping not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Dictionary]
      summary: Delete a merchant mapping
      operationId: deleteMerchantMapping
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Mapping deleted
        '404':
          description: Mapping not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/exchange-rates:
    post:
      tags: [ExchangeRates]
      summary: Save the RD$ per US$ rate for card statements
      description: |
        Saves the rate (context CREDIT_CARD) and posts the categorized US$ statement lines that were
        waiting for a rate. US$ lines never post without one.
      operationId: saveExchangeRate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveExchangeRateRequest'
      responses:
        '200':
          description: Rate saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaveExchangeRateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/income-entries:
    get:
      tags: [Income]
      summary: List income entries
      description: Returns all income entries for the authenticated user, newest first
      operationId: listIncomeEntries
      responses:
        '200':
          description: Income entries retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IncomeEntryResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Income]
      summary: Register a new income entry
      description: Creates an income entry, the associated exchange rate (if USD), and the double-entry journal lines
      operationId: createIncomeEntry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIncomeEntryRequest'
      responses:
        '201':
          description: Income entry created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncomeEntryResponse'
        '422':
          description: Validation error (e.g. missing rate for USD)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/budgets/batch-update:
    post:
      tags: [Reports]
      summary: Batch update budgeted amounts
      description: Upserts budget rows and writes budget_history for each changed account. Only send rows the user actually changed.
      operationId: batchUpdateBudgets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchBudgetUpdateRequest'
      responses:
        '200':
          description: Budgets updated — returns the refreshed report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetReportResponse'
        '422':
          description: Negative amount, or an account that is neither an expense category nor the credit card
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  schemas:
    BudgetScreenResponse:
      type: object
      required: [period, monthStatus, lastUploads, uncategorized, categories]
      properties:
        period:
          type: string
          format: date
        monthStatus:
          $ref: '#/components/schemas/BudgetMonthStatus'
        card:
          $ref: '#/components/schemas/BudgetCardSummary'
          nullable: true
          description: The first active account with statementType CREDIT_CARD; null if there is none
        savings:
          $ref: '#/components/schemas/BudgetSavingsSummary'
          nullable: true
          description: The first active account with statementType SAVINGS; null if there is none
        lastUploads:
          type: array
          items:
            $ref: '#/components/schemas/BudgetLastUpload'
        uncategorized:
          type: array
          description: Every unposted, non-excluded line of imports that aren't reversed, whatever its month, newest first
          items:
            $ref: '#/components/schemas/BudgetTransactionLine'
        categories:
          type: array
          items:
            $ref: '#/components/schemas/BudgetCategoryRow'
        accountOptions:
          type: array
          description: >-
            Every account a line can be categorized to, each with its kind: active expense and income
            accounts, active loans and the card. The UI picks which kinds each line offers.
          items:
            $ref: '#/components/schemas/BudgetAccountOption'

    BudgetMonthStatus:
      type: object
      description: How complete the month is, from its statements
      required: [pendingCount, missingStatements]
      properties:
        pendingCount:
          type: integer
          description: The month's lines (by budget period) still unposted and not excluded
        missingStatements:
          type: array
          description: >-
            The statement accounts (card, savings) whose statement for the month isn't uploaded: for the
            card, a statement cut in the month; for savings, rows in the month and a statement whose cut-off
            is on or after its last day. Reversed and failed statements don't count.
          items:
            $ref: '#/components/schemas/StatementType'

    BudgetCardSummary:
      type: object
      required: [accountId, name, spent]
      properties:
        accountId:
          type: integer
          format: int64
        name:
          type: string
        icon:
          type: string
          nullable: true
        spent:
          type: number
          format: double
          description: Posted charges of the card statement cut in the month, RD$
        budget:
          type: number
          format: double
          nullable: true
          description: The card's own budget, the latest one saved for this month or an earlier one (it carries forward until changed); null when none was ever saved or the latest is 0
        budgetFromMonth:
          type: string
          format: date
          nullable: true
          description: First day of the month that budget was saved for; equals the period when saved this month, earlier when carried forward
        usdRate:
          type: number
          format: double
          nullable: true
          description: The latest card RD$ per US$ rate; null when none was saved (US$ lines then stay unposted)
        statement:
          $ref: '#/components/schemas/BudgetCardStatement'
          nullable: true
          description: The latest card statement up to the month (its billing cycle), as the bank reports it; null without one

    SaveExchangeRateRequest:
      type: object
      required: [value]
      properties:
        value:
          type: number
          format: double
          description: RD$ per US$, e.g. 60.50
        rateDate:
          type: string
          format: date
          nullable: true
          description: Today when omitted

    SaveExchangeRateResponse:
      type: object
      required: [value, rateDate, postedLines]
      properties:
        value:
          type: number
          format: double
        rateDate:
          type: string
          format: date
        postedLines:
          type: integer
          description: US$ lines posted now that a rate exists

    BudgetCardStatement:
      type: object
      required: [cycleStart, cutOffDate, rd, check]
      properties:
        cycleStart:
          type: string
          format: date
          description: First day of the billing cycle (the day after the previous statement's cut-off)
        cutOffDate:
          type: string
          format: date
        paymentDueDate:
          type: string
          format: date
          nullable: true
        rd:
          $ref: '#/components/schemas/BudgetStatementTotals'
        usd:
          $ref: '#/components/schemas/BudgetStatementTotals'
          nullable: true
          description: Null when the statement has no US$ movements or balance
        check:
          $ref: '#/components/schemas/BudgetCardCheck'

    BudgetCardCheck:
      type: object
      description: |
        The card's RD$ balance at the cut-off date, bank vs ledger, and what explains the gap:
        bank = ledger + pending + paymentsToReconcile + difference. US$ isn't reconciled (a
        payment from savings is always RD$, even when it pays the US$ balance); only how many
        of the cycle's US$ charges are posted.
      required: [ledger, pending, pendingCount, paymentsToReconcile, difference, usdCharges, usdPosted]
      properties:
        ledger:
          type: number
          format: double
          description: The card's RD$ ledger balance (owed) at the cut-off date
        pending:
          type: number
          format: double
          description: Net RD$ of the card's unposted, non-excluded lines dated up to the cut-off (charges positive)
        pendingCount:
          type: integer
        paymentsToReconcile:
          type: number
          format: double
          description: |
            RD$ payments from savings to the card in the ledger minus the RD$ payment rows the bank applied,
            up to the cut-off. Positive: payments the bank hasn't applied yet, or that paid the US$ balance;
            negative: payments the bank applied whose savings statement isn't uploaded.
        difference:
          type: number
          format: double
          description: bank − ledger − pending − paymentsToReconcile; 0 when the gap is fully explained
        usdCharges:
          type: integer
          description: US$ charges in the billing cycle
        usdPosted:
          type: integer
          description: How many of them are posted (they wait for a card rate)

    BudgetStatementTotals:
      type: object
      description: One currency of a card statement, in that currency (never converted)
      required: [charges, credits]
      properties:
        charges:
          type: number
          format: double
          description: Charges in the billing cycle
        credits:
          type: number
          format: double
          description: Payments and other credits in the billing cycle
        previousBalance:
          type: number
          format: double
          nullable: true
          description: balance − charges + credits; null when the statement has no balance
        balance:
          type: number
          format: double
          nullable: true
          description: The balance at the cut-off date, as printed on the statement
        minimumPayment:
          type: number
          format: double
          nullable: true

