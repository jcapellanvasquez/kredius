apiVersion: apps/v1
kind: Deployment
metadata:
  name: kredius-backend
  namespace: kredius
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kredius-backend
  template:
    metadata:
      labels:
        app: kredius-backend
    spec:
      containers:
        - name: backend
          image: kredius-backend:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: DEFAULT_SESSION_USER_ID
              valueFrom:
                secretKeyRef:
                  name: kredius-secret
                  key: default-session-user-id
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/kredius
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: kredius-secret
                  key: postgres-user
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kredius-secret
                  key: postgres-password
            - name: SPRING_JPA_DDL_AUTO
              value: update
          resources:
            requests:
              memory: 512Mi
              cpu: 250m
            limits:
              memory: 1200Mi
              cpu: 1000m
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: kredius-backend
  namespace: kredius
spec:
  type: ClusterIP
  selector:
    app: kredius-backend
  ports:
    - port: 8080
      targetPort: 8080
