    PatchStatementLineRequest:
      type: object
      properties:
        categoryAccountId:
          type: integer
          format: int64
          nullable: true
        isExcluded:
          type: boolean
          nullable: true

    RecategorizeStatementLineRequest:
      type: object
      required: [categoryAccountId]
      properties:
        categoryAccountId:
          type: integer
          format: int64

    ConfirmImportResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/StatementImportStatus'
        postedEntries:
          type: integer

    UnresolvedLinesError:
      type: object
      properties:
        error:
          type: string
          example: unresolved_lines
        lineIds:
          type: array
          items:
            type: integer
            format: int64

    ErrorResponse:
      type: object
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: Request validation failed
        details:
          type: array
          items:
            type: string

    MerchantMappingResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        pattern:
          type: string
        accountId:
          type: integer
          format: int64
        accountName:
          type: string

    CreateMerchantMappingRequest:
      type: object
      required: [pattern, accountId]
      properties:
        pattern:
          type: string
          description: Text pattern as it appears in the statement (stored uppercase)
        accountId:
          type: integer
          format: int64

    UpdateMerchantMappingRequest:
      type: object
      required: [accountId]
      properties:
        accountId:
          type: integer
          format: int64

    CreateIncomeEntryRequest:
      type: object
      required: [source, currency, amount, entryDate]
      properties:
        source:
          type: string
          enum: [payroll, other]
        currency:
          type: string
          enum: [RD, USD]
        amount:
          type: number
          format: double
        entryDate:
          type: string
          format: date
        rate:
          type: number
          format: double
          nullable: true
          description: Exchange rate (RD$ per USD). Required when currency is USD.
        bankFee:
          type: number
          format: double
          description: Bank fee deducted in RD$. Defaults to 0.

    IncomeEntryResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        source:
          type: string
        currency:
          type: string
        originalAmount:
          type: number
          format: double
        rate:
          type: number
          format: double
          nullable: true
        bankFee:
          type: number
          format: double
        netAmountRd:
          type: number
          format: double
        entryDate:
          type: string
          format: date

  responses:
    BadRequest:
      description: Bad request — validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
